[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-payment-fraud-detection"
version = "0.1.0"
description = "Leakage-safe real-time payment fraud detection portfolio project"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "lightgbm>=4.5,<5",
    "mlflow>=2.16,<3",
    "pandas>=2.0,<3",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "streamlit>=1.39,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
validation = [
    "great-expectations>=0.18.21,<0.19",
    "pyarrow>=14,<20",
]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"